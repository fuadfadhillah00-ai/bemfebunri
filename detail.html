<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Informasi - BEM FEB UNRI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <nav class="bg-[#0d3b66] text-white py-4 px-6 shadow">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="font-extrabold text-lg text-yellow-400">BEM FEB UNRI Portal</h1>
            <a href="index.html" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded text-white font-medium">
                ← Kembali ke Utama
            </a>
        </div>
    </nav>

    <!-- CONTAINER DETAIL -->
    <main class="max-w-4xl mx-auto w-full p-6 my-8 bg-white rounded-xl shadow-sm border border-slate-200 flex-grow" id="content-container">
        <div class="text-center py-12 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
            <p class="text-xs">Memuat isi informasi dari Spreadsheet...</p>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-xs text-center py-6 mt-auto">
        © 2026 BEM FEB UNRI - Portal Informasi Digital.
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzTKei-C4GONlf-cVFttPWDu6a5tiYhOXI-hIT4mFv3rfr7i--1-seKZeIaKcT1NyzT/exec";

        // 1. Ambil Parameter ?id= dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        function loadArticleDetail() {
            const container = document.getElementById("content-container");

            if (!articleId) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <h2 class="text-2xl font-bold text-slate-800">ID Tidak Ditemukan</h2>
                        <p class="text-xs text-slate-500 mt-2">Tidak ada ID informasi yang dipilih.</p>
                    </div>`;
                return;
            }

            const callbackName = "handleDetail_" + Math.round(Math.random() * 100000);

            window[callbackName] = function(data) {
                if (!data) {
                    container.innerHTML = `
                        <div class="text-center py-12">
                            <h2 class="text-2xl font-bold text-slate-800">Informasi Tidak Ditemukan</h2>
                            <p class="text-xs text-slate-500 mt-2">Data dengan ID "${articleId}" tidak ada di Spreadsheet.</p>
                        </div>`;
                } else {
                    const gambarHtml = (data["Link Gambar / Banner"] && data["Link Gambar / Banner"] !== '-') 
                        ? `<img src="${data["Link Gambar / Banner"]}" class="w-full h-72 object-cover rounded-xl mb-6 border border-slate-100">` 
                        : '';

                    const linkHtml = (data["Link Akses / Pendaftaran"] && data["Link Akses / Pendaftaran"] !== '-')
                        ? `<div class="p-4 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center mt-6">
                            <span class="text-xs font-medium text-slate-600">Akses Tautan Resmi / Pendaftaran:</span>
                            <a href="${data["Link Akses / Pendaftaran"]}" target="_blank" class="bg-yellow-400 hover:bg-yellow-300 text-slate-900 font-bold px-5 py-2 rounded text-xs transition">
                                Buka Tautan →
                            </a>
                           </div>`
                        : '';

                    container.innerHTML = `
                        <div class="mb-4">
                            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                                ${data["Kategori"] || 'Informasi'}
                            </span>
                            <span class="text-xs text-slate-400 ml-3">
                                Dipublikasikan: ${data["Tanggal"] ? new Date(data["Tanggal"]).toLocaleDateString('id-ID') : '-'}
                            </span>
                        </div>

                        <h1 class="text-3xl font-extrabold text-slate-900 mb-2 leading-tight">${data["Judul / Headline"] || 'Tanpa Judul'}</h1>
                        <p class="text-xs text-slate-500 mb-6">Oleh: <strong class="text-slate-700">${data["Penulis / Sumber"] || 'Admin'}</strong></p>

                        ${gambarHtml}

                        <div class="prose max-w-none text-slate-700 text-sm leading-relaxed space-y-4">
                            ${data["Isi Lengkap / Konten"] || 'Belum ada isi konten.'}
                        </div>

                        ${linkHtml}
                    `;
                }
                delete window[callbackName];
            };

            const script = document.createElement("script");
            script.src = `${API_URL}?id=${articleId}&callback=${callbackName}`;
            document.body.appendChild(script);
        }

        document.addEventListener("DOMContentLoaded", loadArticleDetail);
    </script>
</body>
</html>
